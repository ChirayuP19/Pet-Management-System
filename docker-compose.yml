services:

  postgres:
    image: postgres:14
    container_name: microservice_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: chirayu
      POSTGRES_PASSWORD: chirayu
      POSTGRES_DB: chirayu
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - custom-bridge

  pgadmin:
    image: dpage/pgadmin4
    container_name: microservice_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: chirayu010675@gmail.com
      PGADMIN_DEFAULT_PASSWORD: Chirayu@1911
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - custom-bridge

  mailpit:
    image: axllent/mailpit
    container_name: microservice_mailpit
    restart: unless-stopped
    volumes:
      - ./data:/data
    ports:
      - 8025:8025
      - 1025:1025
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - custom-bridge


networks:
  custom-bridge:
    driver: bridge

volumes:
  postgres-data:
  pgadmin_data:
  mailpit_data: